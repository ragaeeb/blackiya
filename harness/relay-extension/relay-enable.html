<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Blackiya Dev Relay</title>
        <style>
            :root {
                color-scheme: light;
                font: 14px ui-sans-serif, system-ui, sans-serif;
                color: #202123;
                background: #f7f7f8;
            }

            body {
                width: 320px;
                margin: 0;
                padding: 18px;
            }

            h1 {
                margin: 0 0 8px;
                font-size: 17px;
            }

            p {
                margin: 8px 0;
                color: #5f6368;
                line-height: 1.4;
            }

            label {
                display: block;
                margin: 14px 0 6px;
                font-weight: 700;
            }

            input[type='url'] {
                width: 100%;
                box-sizing: border-box;
                padding: 8px;
            }

            button {
                margin-top: 14px;
                padding: 8px 12px;
                border: 0;
                border-radius: 6px;
                background: #10a37f;
                color: white;
                font-weight: 700;
            }

            #status {
                min-height: 20px;
                margin-top: 12px;
                color: #0d8a6a;
            }
        </style>
    </head>
    <body>
        <h1>Blackiya Dev Debug Relay</h1>
        <p>Opt-in, localhost-only diagnostics. No cookies, headers, or request bodies are sent.</p>
        <label><input id="relay-enabled" type="checkbox" /> Enable relay</label>
        <label for="relay-url">Collector endpoint</label>
        <input id="relay-url" type="url" autocomplete="off" />
        <button id="save" type="button">Save configuration</button>
        <div id="status" role="status"></div>
        <script src="relay-enable.js"></script>
    </body>
</html>
