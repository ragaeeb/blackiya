name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build project
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run deterministic browser harness
        run: bun run test:e2e -- e2e/harness.playwright.ts

      - name: Run MV3 extension boundary harness
        run: xvfb-run -a bun run test:e2e -- e2e/harness-extension.playwright.ts

      - name: Run authenticated browser relay harness
        run: xvfb-run -a bun run test:e2e -- e2e/relay.playwright.ts

      - name: Create Zip Artifact
        run: bun run zip

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v6
        with:
          name: blackiya-extension
          path: .output/*.zip
          retention-days: 10

      - name: Publish
        run: bun x semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
