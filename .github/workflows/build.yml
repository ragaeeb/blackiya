name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build project
        run: bun run build

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run deterministic browser harness
        run: bun run test:e2e -- e2e/harness.playwright.ts

      - name: Run MV3 extension boundary harness
        run: xvfb-run -a bun run test:e2e -- e2e/harness-extension.playwright.ts

      - name: Run authenticated browser relay harness
        run: xvfb-run -a bun run test:e2e -- e2e/relay.playwright.ts

      - name: Run popup smoke harness
        run: xvfb-run -a bun run test:e2e -- e2e/smoke.playwright.ts

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
